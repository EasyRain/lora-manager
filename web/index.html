<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoRA 管理器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand" data-i18n="LoRA 管理器">LoRA 管理器</div>
  <input id="search" class="search" type="search" data-i18n-ph="搜索标题 / 正文…">
  <button class="btn ghost undo" id="btn-undo" data-i18n="撤销移动" hidden></button>
  <button class="btn ghost" id="btn-root" data-i18n-title="设置 LoRA 根目录"><span data-i18n="根目录">根目录</span></button>
  <button class="btn ghost lang-btn" id="btn-lang" data-i18n-title="切换语言"></button>
  <button class="btn ghost" id="btn-reveal" data-i18n-title="在资源管理器里打开"><span data-i18n="数据">数据</span></button>
  <button class="btn ghost" id="btn-match" data-i18n-title="给还没匹配过的 LoRA 查 Civitai 页面"><span id="match-label" data-i18n="匹配 Civitai">匹配 Civitai</span></button>
  <span class="saved" id="saved" data-i18n="就绪">就绪</span>
  <button class="btn ghost theme-btn" id="btn-theme" data-i18n-title="主题"><span id="theme-label"></span></button>
</header>

<main class="layout">
  <aside class="sidebar" id="cats">
    <div class="cats-list" id="cats-list"></div>
    <div class="cats-foot" id="cats-foot"></div>
  </aside>
  <div class="sidegrip" id="sidegrip" title="拖动调整宽度"></div>
  <section class="content">
    <div class="crumb" id="crumb"></div>
    <div class="cards-wrap" id="scroller">
      <div class="folders" id="folders"></div>
      <div class="cards" id="cards"></div>
      <div class="empty" id="empty" hidden data-i18n="这个文件夹还是空的。在空白处右键新建，或把 .safetensors 拖进来。"></div>
    </div>
    <div class="scroller-btns" id="scroller-btns" hidden>
      <button class="sbtn" id="btn-top" data-i18n-title="回到顶部" title="回到顶部">↑</button>
      <button class="sbtn" id="btn-bottom" data-i18n-title="滚到底部" title="滚到底部">↓</button>
    </div>
  </section>
</main>

<div class="selbar" id="selbar" hidden>
  <span class="selcount"><span id="sel-label"></span> <b id="seln">0</b></span>
  <span class="selorder" id="selorder"></span>
  <label class="sep"><span id="sep-label"></span>
    <select id="sep">
      <option value=", ">, </option>
      <option value=",">,</option>
      <option value="\n">\n</option>
      <option value=" ">␣</option>
    </select>
  </label>
  <label class="chk"><input type="checkbox" id="dedup"> <span id="dedup-label"></span></label>
  <button class="btn primary" id="btn-merge" data-i18n="合并复制">合并复制</button>
  <button class="btn ghost" id="btn-move" data-i18n="移动到…">移动到…</button>
  <button class="btn ghost" id="btn-clearsel" data-i18n="清除">清除</button>
</div>

<!-- 小卡片编辑 -->
<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <input id="ed-title" class="ed-title" data-i18n-ph="标题（可留空），例如：提示词 / 备忘">
      <button class="icon" id="ed-close" data-i18n-title="关闭 (Esc)">✕</button>
    </div>
    <textarea id="ed-body" class="ed-body" data-i18n-ph="写点什么…（回车保存，Shift+回车换行，可直接粘贴截图）"></textarea>
    <div class="ed-foot">
      <div class="thumbwrap" id="thumbwrap">
        <img id="thumb" alt="">
        <button class="icon rm" id="ed-rmimg" data-i18n-title="移除图片">✕</button>
      </div>
      <div class="ed-actions">
        <button class="btn ghost" id="ed-img" data-i18n="选图">选图</button>
        <button class="btn ghost" id="ed-copy" data-i18n="复制正文">复制正文</button>
        <button class="btn ghost" id="ed-format" data-i18n="格式化">格式化</button>
        <span class="grow"></span>
        <span class="hint" data-i18n="回车保存 · Shift+回车换行 · Esc 关闭"></span>
        <button class="btn danger" id="ed-del" data-i18n="删除">删除</button>
        <button class="btn primary" id="ed-save" data-i18n="保存">保存</button>
      </div>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <input type="file" id="file-lora" accept=".safetensors,.sft,.ckpt,.pt,.pth,.bin" multiple hidden>
  </div>
</div>

<!-- 大卡片编辑 -->
<div class="modal" id="modal-card" hidden>
  <div class="sheet small">
    <div class="sheet-head">
      <input id="cd-title" class="ed-title" data-i18n-ph="大卡片标题（留空就用文件名）">
      <button class="icon" id="cd-close">✕</button>
    </div>
    <div class="cd-body">
      <label class="row"><span data-i18n="推荐强度">推荐强度</span>
        <input id="cd-w" class="cd-input" data-i18n-ph="如 0.7-1.0（留空不显示）">
      </label>
      <label class="row"><span data-i18n="所在文件夹">所在文件夹</span>
        <select id="cd-folder"></select>
      </label>
      <p class="tip" id="cd-tip"></p>
    </div>
    <div class="ed-actions cd-actions">
      <span class="grow"></span>
      <button class="btn danger" id="cd-del" data-i18n="删除大卡片">删除大卡片</button>
      <button class="btn primary" id="cd-save" data-i18n="保存">保存</button>
    </div>
  </div>
</div>

<!-- 批量移动 -->
<div class="modal" id="modal-move" hidden>
  <div class="sheet small">
    <div class="sheet-head">
      <div class="ed-title" style="background:transparent;border:0"><span id="mv-head"></span></div>
      <button class="icon" id="mv-close">✕</button>
    </div>
    <div class="cd-body">
      <label class="row"><span data-i18n="目标文件夹">目标文件夹</span>
        <select id="mv-folder"></select>
      </label>
      <p class="tip" data-i18n="LoRA 文件会真的被挪动；只挪卡片不影响文件时，文件保持原位。"></p>
    </div>
    <div class="ed-actions cd-actions">
      <span class="grow"></span>
      <button class="btn primary" id="mv-ok" data-i18n="移动">移动</button>
    </div>
  </div>
</div>

<!-- 预览 -->
<div class="modal" id="modal-preview" hidden>
  <div class="sheet preview-sheet">
    <div class="sheet-head">
      <div class="pv-title" id="pv-title"></div>
      <button class="icon" id="pv-close" data-i18n-title="关闭 (Esc)">✕</button>
    </div>
    <div class="pv-body" id="pv-body"></div>
    <div class="ed-actions cd-actions">
      <span class="hint" data-i18n="双击卡片标题看整张，双击某一条只看那条"></span>
      <span class="grow"></span>
      <button class="btn ghost" id="pv-copy" data-i18n="复制原文">复制原文</button>
      <button class="btn primary" id="pv-edit" data-i18n="编辑">编辑</button>
    </div>
  </div>
</div>

<div class="menu" id="menu" hidden></div>
<div class="dropmask" id="dropmask" hidden><div class="dropbox"><span data-i18n="松开就复制到">松开就复制到</span> <b id="dropdir"></b></div></div>
<div class="toast" id="toast" hidden></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
